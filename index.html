<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stock fundamentals — US exchanges</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Fira+Code:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <div id="app">

    <header class="header">
      <div class="header-left">
        <h1 class="site-title">stock fundamentals</h1>
        <p class="site-sub">NYSE · NASDAQ · AMEX — straight from SEC EDGAR 10-K filings</p>
      </div>
    </header>

    <div class="error-bar" id="error-bar"></div>

    <div class="search-wrap">
      <input type="text" id="search-input" class="search-input" placeholder="ticker or company name — AAPL, Tesla, JPMorgan…" />
      <button id="search-btn">search</button>
      <div class="search-dropdown" id="search-dropdown"></div>
    </div>

    <div class="compare-bar" id="compare-bar" style="display:none;">
      <span class="compare-bar-label">compare with →</span>
      <div class="search-wrap compare-search-wrap">
        <input type="text" id="compare-input" class="search-input" placeholder="add a second ticker…" />
        <button id="compare-btn">compare</button>
        <div class="search-dropdown" id="compare-dropdown"></div>
      </div>
      <button class="clear-btn" id="clear-compare">✕ clear</button>
    </div>

    <div id="company-panel">
      <div class="empty-state">
        type a ticker above — e.g. AAPL, MSFT, TSLA
      </div>
    </div>

    <footer class="footer">
      <div class="footer-left">
        made by <a href="https://www.linkedin.com/in/pragya-chaturvedi" target="_blank" rel="noopener">Pragya</a>
        &nbsp;·&nbsp; data via <a href="https://www.sec.gov/edgar" target="_blank" rel="noopener">SEC EDGAR</a> &amp; Yahoo Finance
      </div>
    </footer>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
